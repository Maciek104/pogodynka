App\Entity\Location:
    properties:
        name:
            - NotBlank:
                  groups: [new, edit]
            - Length:
                  max: 255
                  groups: [new, edit]
        country:
            - NotBlank:
                  groups: [new, edit]
        latitude:
            - NotBlank:
                  groups: [new, edit]
            - Range:
                  min: -90
                  max: 90
                  groups: [new, edit]
        longitude:
            - NotBlank:
                  groups: [new, edit]
            - Range:
                  min: -180
                  max: 180
                  groups: [new, edit]

App\Entity\Measurement:
    properties:
        temperature:
            - Range:
                  max: 60
